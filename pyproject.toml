[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oalex"
dynamic = ["version"]
description = "Async Python client for the OpenAlex scholarly works API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "David Burton", email = "david@databurton.com"}]
keywords = ["openalex", "scholarly", "citations", "research", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/Burton-David/oalex"
"Bug Tracker" = "https://github.com/Burton-David/oalex/issues"
"OpenAlex API" = "https://help.openalex.org/api/"

[tool.hatch.version]
path = "oalex/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["oalex"]

[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md", ".github"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "N", "RUF", "SIM", "PIE"]
ignore = [
    "E501",  # line length enforced by formatter
    "N818",  # OalexUnavailable is public API; renaming it to *Error would break callers
]

[tool.mypy]
strict = true
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oalex"
version = "0.1.0"
description = "Async Python client for the OpenAlex scholarly works API."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "David Burton", email = "david@databurton.com"}]
keywords = ["openalex", "scholarly", "citations", "research", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/Burton-David/oalex"
"Bug Tracker" = "https://github.com/Burton-David/oalex/issues"
"OpenAlex API" = "https://docs.openalex.org/"

[tool.setuptools.packages.find]
include = ["oalex*"]

[tool.setuptools.package-data]
oalex = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "SIM", "PIE"]
ignore = [
    "E501",  # line length enforced by formatter
]

[tool.mypy]
strict = true
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
